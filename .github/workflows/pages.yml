# Publishes the Preset Extractor app to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions" (repo must be public on the free plan).
name: Deploy Preset Extractor to Pages

on:
  push:
    paths: ["lightroom-preset-extractor/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lightroom-preset-extractor
      - id: deployment
        uses: actions/deploy-pages@v4
